[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "castnet"
version = "2.0.0"
description = "From Neural Graphs to Silicon — Sparse LLM inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "datasets>=2.14",
    "safetensors>=0.4",
    "numpy>=1.24",
    "apl-pruning>=0.2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:transformers.*",
    "ignore::UserWarning:huggingface_hub.*",
]

[tool.taskipy.tasks]
clean = "find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null; find . -type f -name '*.pyc' -delete; find . -type d -name '.pytest_cache' -exec rm -rf {} +; find . -type d -name 'htmlcov' -exec rm -rf {} +; find . -type f -name '.coverage' -delete; echo Done"
test = "pytest tests/ -v"
test-unit = "pytest tests/unit/ -v"
test-int = "pytest tests/integration/ -v"
coverage = "pytest tests/ --cov=. --cov-report=term-missing --cov-report=html"
install = "pip install -e '.[dev]'"

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "infrastructure*", "application*", "orchestration*"]
