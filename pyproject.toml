[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "castnet"
version = "2.0.0"
description = "From Neural Graphs to Silicon — Sparse LLM inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "datasets>=2.14",
    "safetensors>=0.4",
    "numpy>=1.24",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]
